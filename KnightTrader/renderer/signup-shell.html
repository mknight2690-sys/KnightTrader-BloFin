<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-src https: http:; img-src https: data:;" />
  <title>Sign up</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 96px; overflow: hidden; background: #0b0f14; color: #e8edf5; font-family: Inter, Segoe UI, sans-serif; }
    body { display: flex; flex-direction: column; }
    .toolbar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
    }
    .toolbar-title { font-size: 13px; font-weight: 600; color: #cbd5e1; }
    .toolbar-hint { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .btn-done {
      border: none; border-radius: 8px; padding: 10px 16px; font-weight: 600; cursor: pointer;
      background: linear-gradient(135deg, #f5c542, #e8a020); color: #0b0d10;
    }
    .btn-done:hover { filter: brightness(1.05); }
    .btn-done:disabled { opacity: 0.7; cursor: wait; }
    #status { font-size: 12px; color: #f5c542; min-height: 16px; padding: 0 14px 8px; }
  </style>
</head>
<body>
  <div class="toolbar">
    <div>
      <div id="title" class="toolbar-title">Sign up</div>
      <div id="hint" class="toolbar-hint">Complete CAPTCHA and forms here, then click Done to continue setup.</div>
    </div>
    <button id="btn-done" type="button" class="btn-done">Done — continue</button>
  </div>
  <div id="status">After you finish on the page below, click Done — continue.</div>
  <script src="signup-shell.js"></script>
</body>
</html>
