<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>Paste credentials</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0b0f14; color: #e8edf5; font-family: Inter, Segoe UI, sans-serif; }
    body { display: flex; flex-direction: column; padding: 14px; gap: 10px; }
    h1 { margin: 0; font-size: 16px; }
    .hint { font-size: 12px; color: #94a3b8; line-height: 1.5; }
    .example {
      font-size: 11px; color: #64748b; background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 10px;
      font-family: Consolas, monospace; white-space: pre-wrap;
    }
    textarea {
      flex: 1; min-height: 180px; resize: vertical; width: 100%;
      padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04); color: #e8edf5; font-family: Consolas, monospace; font-size: 12px;
    }
    .err { color: #f87171; font-size: 12px; min-height: 18px; }
    .actions { display: flex; justify-content: flex-end; gap: 8px; }
    .btn-done {
      border: none; border-radius: 8px; padding: 10px 18px; font-weight: 600; cursor: pointer;
      background: linear-gradient(135deg, #f5c542, #e8a020); color: #0b0d10;
    }
    .btn-done:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <h1 id="title">Paste BloFin API keys</h1>
  <p id="hint" class="hint">Copy all three values from BloFin in one block and paste below. Click Done — keys save encrypted and compendium is written.</p>
  <div class="example">API Key: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
Secret Key: your-secret-key-here
Passphrase: your-passphrase</div>
  <textarea id="paste" placeholder="Paste API Key, Secret Key, and Passphrase here…" spellcheck="false"></textarea>
  <div id="err" class="err"></div>
  <div class="actions">
    <button id="btn-done" type="button" class="btn-done">Done — save credentials</button>
  </div>
  <script>
    const titleEl = document.getElementById('title');
    const hintEl = document.getElementById('hint');
    const pasteEl = document.getElementById('paste');
    const errEl = document.getElementById('err');
    const btn = document.getElementById('btn-done');

    window.pasteShell.getParams().then((cfg) => {
      if (cfg?.title) titleEl.textContent = cfg.title;
      if (cfg?.hint) hintEl.textContent = cfg.hint;
    }).catch(() => {});

    window.pasteShell.onError((msg) => {
      errEl.textContent = msg || 'Could not save — check your paste.';
      btn.disabled = false;
    });

    btn.addEventListener('click', () => {
      const text = pasteEl.value.trim();
      if (!text) {
        errEl.textContent = 'Paste your API Key, Secret Key, and Passphrase first.';
        return;
      }
      errEl.textContent = '';
      btn.disabled = true;
      window.pasteShell.done(text);
    });
  </script>
</body>
</html>
